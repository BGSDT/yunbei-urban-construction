def modrinthConfig = new Properties()
def modrinthConfigFile = rootProject.file('../../modrinth.properties')
if (modrinthConfigFile.isFile()) {
    modrinthConfigFile.withInputStream { modrinthConfig.load(it) }
}

def changelogFile = rootProject.file('../../CHANGELOG.md')

subprojects { platformProject ->
    if (!(platformProject.name in ['fabric', 'forge', 'neoforge'])) {
        return
    }

    platformProject.plugins.withId('dev.architectury.loom') {
        platformProject.apply plugin: 'com.modrinth.minotaur'

        def loader = platformProject.name
        def loaderTitle = loader == 'neoforge' ? 'NeoForge' : loader.capitalize()
        def cfgProjectId = modrinthConfig.getProperty("project_id_${loader}",
            modrinthConfig.getProperty('project_id', ''))
        def cfgProjectName = modrinthConfig.getProperty('project_name', rootProject.archives_name)
        def cfgVersionType = modrinthConfig.getProperty('version_type', 'release')
        def cfgToken = modrinthConfig.getProperty('token', '')

        platformProject.modrinth {
            token = cfgToken
            projectId = cfgProjectId
            versionNumber = "${rootProject.mod_version}+${rootProject.minecraft_version}+${loader}"
            versionName = "${cfgProjectName} ${rootProject.mod_version}+${rootProject.minecraft_version}+${loader}"
            versionType = cfgVersionType
            uploadFile = platformProject.tasks.named('remapJar')
            gameVersions = [rootProject.minecraft_version]
            loaders = [loader]
            if (changelogFile.isFile()) {
                changelog = changelogFile.getText('UTF-8')
            }
        }

        platformProject.tasks.named('modrinth').configure {
            doFirst {
                if (!cfgProjectId) {
                    throw new GradleException(
                        "Missing project_id (or project_id_${loader}) in repository-root modrinth.properties.")
                }
                if (!cfgToken) {
                    throw new GradleException(
                        'Missing token in repository-root modrinth.properties.')
                }
            }
        }

        platformProject.tasks.register('publishModrinth') {
            group = 'publishing'
            description = "Uploads the remapped ${loaderTitle} jar to Modrinth."
            dependsOn platformProject.tasks.named('remapJar')
            dependsOn platformProject.tasks.named('modrinth')
        }
    }
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = 'Uploads the Fabric, Forge and NeoForge jars for this Minecraft version to Modrinth.'
    dependsOn {
        subprojects.findAll { it.name in ['fabric', 'forge', 'neoforge'] }
            .collect { it.tasks.named('publishModrinth') }
    }
}
