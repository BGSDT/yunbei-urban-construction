pluginManagement {
    repositories {
        maven { name = 'LoomMinecraftCache'; url = uri("$rootDir/.gradle/loom-cache/minecraftMaven") }
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://neoforged.forgecdn.net/releases/' }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        if (System.getenv('CI') != 'true') {
            maven { name = 'AliyunPublic'; url = 'https://maven.aliyun.com/repository/public/' }
            maven { name = 'AliyunGoogle'; url = 'https://maven.aliyun.com/repository/google/' }
        }
        mavenCentral()
        maven { name = 'NeoForged'; url = 'https://neoforged.forgecdn.net/releases/' }
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        if (System.getenv('CI') != 'true') {
            maven { name = 'MinecraftLibraries'; url = 'https://bmclapi2.bangbang93.com/maven/' }
        }
    }
}

rootProject.name = '26.1.2'

// Minecraft 26.x ships an unobfuscated jar and Mojang no longer publishes ProGuard
// mappings, so there is no intermediary/remap step: :common is a plain Loom
// "no-remap" project and the platform jars pack its output directly.
include 'common'
include 'fabric'
include 'neoforge'
