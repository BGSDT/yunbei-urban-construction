name: Multi-version build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-1-21-1:
    name: Minecraft 1.21.1 (Fabric + NeoForge)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric and NeoForge
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Upload Fabric 1.21.1
        uses: actions/upload-artifact@v4
        with:
          name: yunbeiuc-fabric-1.21.1
          if-no-files-found: error
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev-shadow.jar

      - name: Upload NeoForge 1.21.1
        uses: actions/upload-artifact@v4
        with:
          name: yunbeiuc-neoforge-1.21.1
          if-no-files-found: error
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev-shadow.jar

  build-1-20-1:
    name: Minecraft 1.20.1 (Fabric + Forge)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout maintained 1.20.1 branch
        uses: actions/checkout@v4
        with:
          ref: '1.20.1'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric and Forge
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Upload Fabric 1.20.1
        uses: actions/upload-artifact@v4
        with:
          name: yunbeiuc-fabric-1.20.1
          if-no-files-found: error
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev-shadow.jar

      - name: Upload Forge 1.20.1
        uses: actions/upload-artifact@v4
        with:
          name: yunbeiuc-forge-1.20.1
          if-no-files-found: error
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-dev-shadow.jar
