name: Build 1.21.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Fabric and NeoForge
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yunbeiuc-fabric-1.21.1
          if-no-files-found: error
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev-shadow.jar

      - name: Upload NeoForge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yunbeiuc-neoforge-1.21.1
          if-no-files-found: error
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev-shadow.jar