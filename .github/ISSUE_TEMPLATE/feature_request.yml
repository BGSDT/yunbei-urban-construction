name: 功能请求
description: 提出一项新的功能。
labels: ["新功能"]
body:
  - type: markdown
    attributes:
      value: |
        👆请在上面攥写你的标题。云北城建是一款认真听取社区意见的模组，非常欢迎大家提出建议，便于开发者了解你的想法。
        目前模组开发内容为道路设施，请不要上传其他内容。
        
        > [!important]
        > 如果要提出多个功能，请为每一个功能开一个单独的 issue。
        > 由于开发者目前大多为学生党，需要一边专注于学业一边维护模组，加上模组积压了大量的功能请求，你所提交的想法可能会很久才会实现。
        
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      description: 在开始撰写这个 issue 前，请先检查：
      options:
        - label: 我已更新到最新版的云北城建，确认此功能还未实现。我也已在 [Issues](https://github.com/BGSDT/yunbei-urban-construction/issues) 中检索，确认此想法未被其他人提交过。
          required: true
        - label: 我已知晓开发者时间精力有限，该功能实现可能会很久。
          required: true
  - type: markdown
    attributes: 
      value: |
        > [!note]
        > 上传附件时请使用 GitHub 的附件系统上传附件，将需要上传的附件粘贴或拖动到撰写区域即可上传。多个文件可打包为 zip 格式后上传。
  - type: textarea
    id: back
    attributes:
      label: 背景动机
      description: 你是在什么情况下想让模组添加此功能？
    validations:
      required: true
  - type: textarea
    id: req
    attributes:
      label: 理想状态下的功能
      description: 详细地描述一下你想要的功能，描述的越具体，采纳的可能性越高，同时如果提交的内容为还原现实中某一方块、建筑，请一并附带参考图。
    validations:
      required: true
  - type: checkboxes
    id: revision
    attributes:
      label: 最后一步
      description: 回顾表单
      options:
        - label: 我认为上述的描述已经十分详细，能够让开发人员能了解你的想法。如果我的 issue 没有按照上述的要求填写，可能会被无视。
          required: true
